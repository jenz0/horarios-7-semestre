name: Lembretes

on:
  schedule:
    # a cada 15 min entre 09:00 e 00:00 UTC = 06:00 às 21:00 em Salvador.
    # O cron do GitHub Actions costuma atrasar alguns minutos; a janela de
    # 15 min em enviar.js absorve isso.
    - cron: "*/15 9-23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal | teste | seco"
        required: false
        default: "teste"

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install web-push --no-save
       - name: Verificar par VAPID
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          node - <<'NODE'
          const crypto = require('crypto');

          const privateKey = Buffer.from(process.env.VAPID_PRIVATE, 'base64url');

          const ecdh = crypto.createECDH('prime256v1');
          ecdh.setPrivateKey(privateKey);

          const derivedPublic = ecdh
            .getPublicKey(null, 'uncompressed')
            .toString('base64url');

          if (derivedPublic === process.env.VAPID_PUBLIC) {
            console.log('VAPID MATCH: OK');
          } else {
            console.log('VAPID MATCH: FAIL');
            process.exit(1);
          }
          NODE

      - name: Enviar lembretes
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            teste) node push/enviar.js --teste ;;
            seco) node push/enviar.js --seco ;;
            *) node push/enviar.js ;;
          esac
      - name: Enviar lembretes
        env:
          VAPID_PUBLIC:  ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUB:      ${{ secrets.PUSH_SUB }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            teste) node push/enviar.js --teste ;;
            seco)  node push/enviar.js --seco  ;;
            *)     node push/enviar.js         ;;
          esac
